{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>Welcome to My Portfolio Contacts!</h1>
<p>Django project successfully connected! 🎉</p>

<form method="POST" action="{% url 'login' %}">
  
    {% csrf_token %}

    <div class="container-fluid">
  <div class="row m-3 justify-content-center">
    <div class="col-md-5 m-5">
        <div class="card shadow" >
    <h1 class="display-2.5 p-5 fw-bold text-success">Login FORM</h1>
<div class="mb-3 px-4">
    <label for="username" class="form-label">Username:</label>
    <input type="text" class="form-control" id="id_username" placeholder="Enter Username" name="username">
    
  </div>

 
  <div class="mb-3 px-4">
    <label for="password" class="form-label">Password:</label>
    <input type="password" class="form-control" id="id_password" placeholder="Enter password" name="password">
  </div>

  
  
  <div class="button pb-5">
  <button type="submit" class="btn btn-success shadow">Submit</button>
  </div>

    </div>
  </div>

</div>
</form>
 
{% endblock %}
