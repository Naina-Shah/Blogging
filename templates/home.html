{% extends "base.html" %}
{% load static %}
{% block title %} Home Page {% endblock %}

{% block content %}
<form method="POST" >
    {% csrf_token %}

<div class="containor justify-content-center  vh-100 " > 
  <div class="row mx-5 ">
<h1 style="font-weight: 900;"> Blogs</h1>
    {% for blog in blogs %}
    <div class="col-md-6 col-lg-4 col-sm-12 g-3">
        
        <div class="card shadow p-3 " >
            <div class="card-body">
                <h5 class="card-title h3 fw-bold text-success ">{{ blog.title }}</h5>
                <p class="card-text">{{ blog.content|truncatewords:20 }}</p>
                <h6  style="font-weight: 700; color:darkolivegreen">{{ blog.author.username }}</h6>
                
                         <a href="{% url 'blog_detail' blog.id %}" class="btn btn-success">
    Read More
</a>

            </div>
        </div>
    </div>
    {% endfor %}
</div>
</div>

    <hr>

{% endblock %}
